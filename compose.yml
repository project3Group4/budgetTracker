#defines containers Docker will run
services:
  #Name of our PostgreSQL service
  db:
    image: postgres:17
    container_name: budgettracker-db
    environment:
      POSTGRES_DB: budgettracker
      POSTGRES_USER: budgetuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
# Starter OpenAPI contract for CST 438 Project 03.
# Render it:   https://editor.swagger.io  (File > Import file, or paste)
# Lint it:     npx @redocly/cli lint docs/openapi.yaml
# Mock it:     npx @stoplight/prism-cli mock docs/openapi.yaml   -> http://127.0.0.1:4010
openapi: 3.0.3


info:
  title: Budgeting API
  version: 1.0.0
  description: |
    API for our budgeting application.
    Every error uses RFC 9457 Problem Details (see components/schemas/Problem).
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  contact:
    name: Team 04
    url: https://github.com/project3Group4/budgetTracker


servers:
  - url: http://localhost:8080
    description: Local (docker compose up)
  - url: https://budget-api.example.com
    description: Production (replace when set up)


# Every endpoint requires a Bearer token unless it overrides this with `security: []`.
security:
  - bearerAuth: []


tags:
  - name: User
    description: The signed-in user's own account
  - name: Admin
    description: Admin-only user management
  - name: Category
    description: The application's spending categories
  - name: Financials
    description: The user's finances based on category


paths:
  /api/v1/user/me:
    get:    
      tags: [User]
      operationId: getMe
      summary: Get the signed-in user
      description: >-
        Returns the caller's account. On the first call with a new Google
        account, the user row is created with role USER.
      responses:
        '200':
          description: The signed-in user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [User]
      operationId: deleteMyAccount
      summary: Delete my own account and ALL my data
      description: Any signed-in user. Deletes the user row and everything they own (expenses, paycheck, etc).
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '204':
          description: Deleted. The token is now useless.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [User]
      operationId: updateDisplayName
      summary: Updates my own display name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MyUserPatch'
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '200':
          description: The updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'


  /api/v1/user:
    get:
      tags: [Admin]
      operationId: listUsers
      summary: List all users (admin only)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '200':
          description: One page of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'


  /api/v1/user/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          example: 7
    get:
      tags: [Admin]
      operationId: getUser
      summary: View one user (admin only)
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '200':
          description: The user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Admin]
      operationId: updateUserRole
      summary: Grant or revoke admin (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPatch'
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '200':
          description: The updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Admin]
      operationId: deleteUser
      summary: Delete a user and all their data (admin only)
      description: Requires the ADMIN role. A USER token gets 403.
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        
  /api/v1/user/me/paycheck-budget:
    get:
      tags: [User]
      operationId: getPaycheckBudget
      summary: Gives the current paycheck amount and savings amount for the logged in user
      responses:
        '200':
          description: Paycheck amount and savings amount
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaycheckBudget'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [User]
      operationId: updatePaycheckBudget
      summary: Updates the current paycheck budget information
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePaycheckBudget'
      responses:
        '200':
          description: The updated paycheck budget
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaycheckBudget'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [User]
      operationId: deletePaycheckBudget
      summary: Delete a paycheck budget and current savings information
      responses:
        '204':
          description: Paycheck and savings percentage deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'


  /api/v1/categories:
    get:
      tags: [Category]
      operationId: getCategories
      summary: Gets all categories in a page
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: One page of categories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Category]
      operationId: createCategory
      summary: Creates a new category (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreate'
      responses:
        '201':
          description: URL of new category
          headers:
            Location:
              schema:
                type: string
                example: /api/v1/categories/67
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'


  /api/v1/categories/{categoryId}:
    parameters:
      - name: categoryId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          example: 7
    get:
      tags: [Category]
      operationId: getCategoryById
      summary: Gets a category by it's id
      responses:
        '200':
          description: The category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Category]
      operationId: patchCategory
      summary: Updates boolean is_active (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategory'
      responses:
        '200':
          description: The updated category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Category]
      operationId: deleteCategory
      summary: Deletes category (admin only)
      responses:
        '204':
          description: Category deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'


  /api/v1/user/me/{categoryId}/financials:
    parameters:
    - name: categoryId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    get:
      tags: [Financials]
      operationId: getMyFinancials
      summary: Gets financials per category for the signed-in user
      responses:
        '200':
          description: The user's financials
          content:
            application/json:
              schema:
                  $ref: '#/components/schemas/Financials'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Financials]
      operationId: putMyFinancials
      summary: Creates a new financial information for the signed-in user per category (impotent, will replace exisiting financial info)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinancialsCreate'
      responses:
        '201':
          description: Created financial information
          headers:
            Location:
              description: URL of the new finance info
              schema:
                type: string
                example: /api/v1/user/me/7/financials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Financials'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Financials]
      operationId: updateMyFinancials
      summary: Updates the spent amount for financials in this category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFinancials'
      responses:
        '200':
          description: The updated category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Financials'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Financials]
      operationId: deleteMyFinancials
      summary: Deletes the financial for this category
      responses:
        '204':
          description: Financial deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'




components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT from the OAuth2 Authorization Code + PKCE flow (with Google, send the ID token; Google's access_token is opaque).


  parameters:
    Page:
      name: page
      in: query
      description: Zero-based page number
      schema:
        type: integer
        minimum: 0
        default: 0
        
    Size:
      name: size
      in: query
      description: Items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20


  schemas:
    PaycheckBudget:
      type: object
      required: [id, paycheckAmount, savingsPercent]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          example: 69
        paycheckAmount:
          type: number
          format: double
          example: 420.67
        savingsPercent:
          type: number
          format: double
          example: 20.5
    
    UpdatePaycheckBudget:
      type: object
      description: Body for PATCH /api/v1/user/me/paycheck-budget. The paycheck amount and savings percentage can both be updated.
      minProperties: 1
      properties:
        paycheckAmount:
          type: number
          format: double
          example: 420.67
        savingsPercent:
          type: number
          format: double
          example: 20.5

    Category:
      type: object
      required: [id, name, is_active]
      properties:
        id: 
          type: integer
          format: int64
          example: 7
        name:
          type: string
          example: "groceries"
        is_active:
          type: boolean
          example: True


    CategoryPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        page:
          $ref: '#/components/schemas/PageMeta'


    CategoryCreate:
      type: object
      required: [name, is_active]
      properties:
        name:
          type: string
          example: "groceries"
        is_active:
          type: boolean
          example: True


    UpdateCategory:
      description: Body for PATCH /api/v1/categories/{categoryId}. The only editable field is the boolean
      type: object
      required: [is_active]
      properties:
        is_active:
          type: boolean
          example: True



    Financials:
      type: object
      required: [id, categoryId]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          example: 15
        categoryId:
          type: integer
          format: int64
          example: 7
        spentAmount:
          type: number
          format: double
          example: 75.50


    FinancialsCreate:
      type: object 
      required: [spentAmount]
      properties:
        spentAmount:
          type: number
          format: double
          example: 75.50


    UpdateFinancials:
      description: The only editable field is the spentAmount
      type: object
      required: [spentAmount]
      properties:
        spentAmount:
          type: number
          format: double
          example: 75.50

    PageMeta:
      description: >-
        Spring Data's PagedModel shape. Turn it on with
        spring.data.web.pageable.serialization-mode=via_dto in application.properties.
      type: object
      required: [size, number, totalElements, totalPages]
      properties:
        size:
          type: integer
          example: 20
        number:
          type: integer
          example: 0
        totalElements:
          type: integer
          format: int64
          example: 57
        totalPages:
          type: integer
          example: 3


    User:
      type: object
      required: [id, email, displayName, role]
      properties:
        id:
          type: integer
          format: int64
          example: 7
        email:
          type: string
          format: email
          example: sam@csumb.edu
        displayName:
          $ref: '#/components/schemas/DisplayName'
        role:
          $ref: '#/components/schemas/Role'


    Role:
      type: string
      enum: [USER, ADMIN]


    DisplayName:
      type: string
      example: Sam Otter


    MyUserPatch:
      description: Body for PATCH /api/v1/user/me. The only editable field is the display name.
      type: object
      required: [displayName]
      properties:
        displayName:
          $ref: '#/components/schemas/DisplayName'


    UserPatch:
      description: Body for PATCH /api/v1/user/{userId}. Today the only editable field is the role.
      type: object
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/Role'


    UserPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/User'
        page:
          $ref: '#/components/schemas/PageMeta'


    Problem:
      description: RFC 9457 Problem Details. The ONE error body every endpoint returns.
      type: object
      required: [title, status]
      properties:
        type:
          type: string
          default: about:blank
        title:
          type: string
          example: Not Found
        status:
          type: integer
          example: 404
        detail:
          type: string
          example: Category 42 not found
        instance:
          type: string
          example: /api/v1/categories/42


  responses:
    BadRequest:
      description: Validation failed or malformed JSON
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Bad Request
            status: 400
            detail: One or more fields failed validation. Check the request against the contract.
    Unauthorized:
      description: Missing or invalid token
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Unauthorized
            status: 401
    Forbidden:
      description: Valid token, but not allowed (for example, not an admin)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Forbidden
            status: 403
    NotFound:
      description: Doesn't exist, or belongs to someone else
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Not Found
            status: 404
            detail: Category 42 not found
    InternalError:
      description: Unexpected server error. Your app still needs to show something useful.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Internal Server Error
            status: 500

spring.config.import=optional:file:.env[.properties]

spring.application.name=api
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/budgettracker}
spring.datasource.username=${DB_USER:budgetuser}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

# api needs these github app values to verify a user's sign-in.
app.oauth.github.client-id=${GITHUB_CLIENT_ID}
app.oauth.github.client-secret=${GITHUB_CLIENT_SECRET}

# names this api as the creator of its login tokens
# the api will check this value when it receives a token later
app.jwt.issuer=${APP_JWT_ISSUER:http://localhost:8080}

# tells the api where to get its private signing key
app.jwt.secret-base64=${APP_JWT_SECRET_BASE64}

# sets how long each login token stays valid
# pt1h means the token expires after one hour
app.jwt.ttl=${APP_JWT_TTL:PT1H}
